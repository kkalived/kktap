<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KK渚垮埄璐?- 鍘熷瀷鍥?/title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "寰蒋闆呴粦", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px;
        }

        .prototype-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-bottom: 40px;
            font-size: 16px;
        }

        .section {
            margin-bottom: 60px;
        }

        .section-title {
            color: white;
            font-size: 20px;
            margin-bottom: 20px;
            padding-left: 10px;
            border-left: 4px solid #FFD700;
        }

        .prototype-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .desktop-mockup {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .mockup-label {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .windows-desktop {
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><rect fill="%230078aa" width="1920" height="1080"/><rect fill="%2300645e" y="950" width="1920" height="130"/></svg>');
            background-size: cover;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            height: 400px;
        }

        /* 渚垮埄璐存牱寮?*/
        .sticky-note {
            position: absolute;
            width: 280px;
            height: 280px;
            background: #FFF9C4;
            border-radius: 3px;
            box-shadow: 2px 3px 10px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .note-header {
            height: 32px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.02), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            cursor: move;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .note-title {
            font-size: 12px;
            color: #999;
        }

        .note-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .note-count {
            font-size: 11px;
            color: #aaa;
        }

        .btn-close {
            width: 20px;
            height: 20px;
            border: none;
            background: transparent;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .btn-close:hover {
            background: #E53935;
            color: white;
        }

        .note-body {
            flex: 1;
            padding: 12px;
            overflow: hidden;
        }

        .note-content {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            font-size: 14px;
            color: #333;
            resize: none;
            font-family: inherit;
            outline: none;
        }

        .note-content::placeholder {
            color: #bbb;
        }

        .note-toolbar {
            height: 36px;
            border-top: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 4px;
        }

        .toolbar-btn {
            padding: 4px 8px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            color: #666;
            border-radius: 3px;
            transition: background 0.2s;
        }

        .toolbar-btn:hover {
            background: rgba(0,0,0,0.08);
        }

        .toolbar-btn-bold {
            font-weight: bold;
        }

        .toolbar-btn-italic {
            font-style: italic;
        }

        .toolbar-btn-todo {
            font-size: 14px;
        }

        .page-curl {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.1) 50%);
            cursor: pointer;
            border: none;
        }

        .curl-arrow {
            position: absolute;
            bottom: 4px;
            right: 4px;
            font-size: 12px;
            color: #999;
        }

        /* 鍫嗗彔鏁堟灉 */
        .note-stack {
            position: absolute;
        }

        .note-stack .note-underlay {
            position: absolute;
            top: 4px;
            right: -4px;
            width: 100%;
            height: 100%;
            background: #FFF59D;
            border-radius: 3px;
            z-index: -1;
            transform: rotate(1deg);
        }

        .note-stack .note-underlay-2 {
            top: 8px;
            right: -8px;
            background: #FFEE58;
            transform: rotate(-0.5deg);
        }

        /* 闇插嚭杈圭紭 */
        .peek-indicator {
            position: absolute;
            top: 50%;
            right: -30px;
            transform: translateY(-50%);
            width: 30px;
            height: 80px;
            background: linear-gradient(to right, #FFF9C4, #FFEE58);
            border-radius: 0 5px 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 10px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        /* 鎴浘閫夊尯 */
        .screenshot-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
        }

        .selection-box {
            position: absolute;
            border: 2px dashed #2196F3;
            background: rgba(33,150,243,0.1);
            cursor: move;
        }

        .selection-info {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2196F3;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
        }

        /* 鍙抽敭鑿滃崟 */
        .context-menu {
            position: absolute;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            min-width: 180px;
            padding: 6px 0;
            z-index: 1000;
        }

        .context-item {
            padding: 10px 16px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.15s;
        }

        .context-item:hover {
            background: #F5F5F5;
        }

        .context-item-icon {
            font-size: 14px;
            width: 20px;
            text-align: center;
        }

        .context-divider {
            height: 1px;
            background: #eee;
            margin: 6px 0;
        }

        /* 鍘嗗彶璁板綍绐楀彛 */
        .history-window {
            position: absolute;
            width: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .window-header {
            background: linear-gradient(to bottom, #f8f8f8, #f0f0f0);
            padding: 16px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .window-title {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }

        .window-body {
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .history-item {
            background: #FFF9C4;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-content {
            flex: 1;
            font-size: 13px;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-meta {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .history-actions {
            display: flex;
            gap: 8px;
        }

        .btn-restore {
            padding: 6px 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-delete {
            padding: 6px 12px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        /* 璁剧疆绐楀彛 */
        .settings-window {
            position: absolute;
            width: 450px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .settings-section {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .settings-section:last-child {
            border-bottom: none;
        }

        .settings-label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 12px;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .settings-row:last-child {
            margin-bottom: 0;
        }

        .settings-desc {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .input-shortcut {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            width: 150px;
            text-align: center;
        }

        .toggle-switch {
            position: relative;
            width: 48px;
            height: 26px;
            background: #ccc;
            border-radius: 13px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.active {
            background: #4CAF50;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active::after {
            transform: translateX(22px);
        }

        /* 绯荤粺鎵樼洏 */
        .tray-menu {
            position: absolute;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            min-width: 200px;
            padding: 6px 0;
            z-index: 1000;
        }

        .tray-item {
            padding: 10px 16px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tray-item:hover {
            background: #F5F5F5;
        }

        .tray-icon {
            width: 24px;
            height: 24px;
            background: #FFF9C4;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* 寰呭姙浜嬮」 */
        .todo-line {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }

        .todo-toggle {
            width: 18px;
            height: 18px;
            border: 2px solid #999;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: transparent;
            transition: all 0.2s;
        }

        .todo-line.is-checked .todo-toggle {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }

        .todo-line.is-checked .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .todo-text {
            flex: 1;
        }

        /* 鎴浘棰勮 */
        .screenshot-preview {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .screenshot-preview img {
            max-width: 150px;
            max-height: 100px;
            border-radius: 4px;
        }

        /* 鍔ㄧ敾鏁堟灉璇存槑 */
        .animation-demo {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 30px;
            margin-top: 30px;
        }

        .animation-steps {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .animation-step {
            text-align: center;
            color: white;
        }

        .step-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 10px;
        }

        .step-label {
            font-size: 13px;
            opacity: 0.8;
        }

        .arrow {
            font-size: 24px;
            color: rgba(255,255,255,0.5);
        }

        /* 鍝嶅簲寮?*/
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            .prototype-grid {
                grid-template-columns: 1fr;
            }

            .animation-steps {
                flex-direction: column;
            }

            .arrow {
                transform: rotate(90deg);
            }
        }
    </style>
</head>
